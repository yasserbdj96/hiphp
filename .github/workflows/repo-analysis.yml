name: Enhanced Repository Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, closed, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_analysis:
        description: 'Perform full analysis (ignore cache)'
        required: false
        default: 'false'
        type: string
      max_files:
        description: 'Maximum files to analyze (0 = unlimited)'
        required: false
        default: '0'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # `write` (not `read`) is required here: if the GitHub App has been
      # uninstalled (or this repo removed from it), the "Send analysis to
      # external service" step below gets told to remove this very
      # workflow file (see the "Remove workflow" step) using this job's
      # own auto-issued GITHUB_TOKEN - contents:write is what lets that
      # delete-and-commit call succeed.
      contents: write
      actions: read
    timeout-minutes: 30  # ⏱️ Hard limit for workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          # For large repos, limit fetch depth
          fetch-depth: ${{ github.event_name == 'push' && 50 || 0 }}

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Load webhook configuration
        env:
          WEBHOOK_CONFIG: ${{ secrets.WEBHOOK_CONFIG }}
        run: |
          if [ -z "$WEBHOOK_CONFIG" ]; then
            echo "❌ WEBHOOK_CONFIG secret is not set!"
            exit 1
          fi

          # WEBHOOK_CONFIG packs WEBHOOK_ENDPOINT :: WEBHOOK_API_TOKEN :: WEBSITE_BASE_URL
          # joined by "::#?::". Split it back apart and export each part as
          # a real env var so every later step (and the Python analyzer
          # script it runs) can just read os.environ / $VAR as before.
          mapfile -t PARTS <<< "$(printf '%s' "$WEBHOOK_CONFIG" | sed 's/::#?::/\n/g')"

          WEBHOOK_ENDPOINT="${PARTS[0]}"
          WEBHOOK_API_TOKEN="${PARTS[1]}"
          BASE_URL="${PARTS[2]}"

          if [ -z "$WEBHOOK_ENDPOINT" ] || [ -z "$WEBHOOK_API_TOKEN" ] || [ -z "$BASE_URL" ]; then
            echo "❌ WEBHOOK_CONFIG is malformed (expected 3 parts split by '::#?::')"
            exit 1
          fi

          # Mask the sensitive parts in the logs before exporting them.
          echo "::add-mask::$WEBHOOK_API_TOKEN"
          echo "::add-mask::$WEBHOOK_ENDPOINT"

          {
            echo "WEBHOOK_ENDPOINT=$WEBHOOK_ENDPOINT"
            echo "WEBHOOK_API_TOKEN=$WEBHOOK_API_TOKEN"
            echo "BASE_URL=$BASE_URL"
            echo "WEBSITE_BASE_URL=$BASE_URL"
          } >> "$GITHUB_ENV"

          echo "✅ Webhook configuration loaded"

      - name: Check GitHub App installation
        id: check_install
        run: |
          # Cheap pre-flight against /webhook/status - answers "is the
          # GitHub App still installed on this repo?" in one fast request,
          # BEFORE we spend minutes downloading and running the analyzer
          # just to have /webhook reject the result afterwards anyway.
          echo "🔎 Checking whether the GitHub App is installed for this repository..."
          HTTP_CODE=$(curl -L -X GET "$BASE_URL/webhook/status" \
            -H "Accept: application/json" \
            -H "X-API-Token: $WEBHOOK_API_TOKEN" \
            -H "X-Repository: ${{ github.repository }}" \
            --max-time 30 \
            --connect-timeout 15 \
            --retry 2 \
            --retry-delay 3 \
            -s \
            -o /dev/null \
            -w "%{http_code}")

          echo "📡 Response status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "410" ]; then
            echo "⛔ GitHub App is not installed for this repository - skipping analysis."
            echo "app_uninstalled=true" >> "$GITHUB_OUTPUT"
          else
            # Any other response (200, or a transient network/5xx hiccup)
            # fails OPEN - we proceed with the analysis as before, and
            # /webhook's own check further down is still the authoritative
            # gate on whether the result actually gets accepted.
            echo "✅ Proceeding with analysis."
            echo "app_uninstalled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check repository size
        id: check_size
        if: steps.check_install.outputs.app_uninstalled != 'true'
        run: |
          TOTAL_SIZE=$(du -sb . 2>/dev/null | cut -f1 || echo "0")
          MAX_SIZE=$((100 * 1024 * 1024 * 1024))  # 100 GB max for auto-analysis
          
          if [ -n "$TOTAL_SIZE" ] && [ "$TOTAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️ Repository size ($(($TOTAL_SIZE/1024/1024/1024)) GB) exceeds limit (100 GB). Skipping full analysis."
            echo "LIMIT_EXCEEDED=true" >> $GITHUB_OUTPUT
            echo "Skipping full analysis - use manual trigger for large repos"
          else
            echo "LIMIT_EXCEEDED=false" >> $GITHUB_OUTPUT
            echo "SIZE_MB=$(($TOTAL_SIZE/1024/1024))" >> $GITHUB_OUTPUT
          fi

      - name: Download analyzer script
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.check_size.outputs.LIMIT_EXCEEDED == 'false'
        run: |
          echo "📥 Downloading enhanced_analyzer.py from $BASE_URL/enhanced_analyzer.py"
          curl -L -o enhanced_analyzer.py "$BASE_URL/enhanced_analyzer.py?t=$WEBHOOK_API_TOKEN" \
            -H 'Accept: text/x-python' \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2

          if [ ! -f enhanced_analyzer.py ]; then
            echo '❌ Failed to download enhanced_analyzer.py'
            exit 1
          fi

          LINE_COUNT=$(wc -l < enhanced_analyzer.py)
          echo "✅ Downloaded enhanced_analyzer.py ($LINE_COUNT lines)"

      - name: Run enhanced repository analysis
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.check_size.outputs.LIMIT_EXCEEDED == 'false'
        run: |
          echo "🚀 Starting analysis..."
          # Run with timeout protection
          timeout 300 python3 enhanced_analyzer.py || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "⚠️ Analysis timed out after 300 seconds"
              echo "Creating partial results..."
            else
              echo "❌ Analysis failed with exit code: $EXIT_CODE"
              exit $EXIT_CODE
            fi
          }

          # Check if results were generated
          if [ -f "enhanced_analysis_result.json" ]; then
            echo "✅ Analysis completed successfully"
            FILE_SIZE=$(stat -c%s enhanced_analysis_result.json 2>/dev/null || stat -f%z enhanced_analysis_result.json 2>/dev/null || echo "0")
            echo "📊 Results file size: $(($FILE_SIZE/1024)) KB"
          else
            echo "❌ No analysis results generated"
            # Create minimal result file
            echo '{
              "error": "Analysis timed out or failed",
              "repository": "${{ github.repository }}",
              "summary": {
                "total_files": 0,
                "code_lines": 0
              }
            }' > enhanced_analysis_result.json
          fi

      - name: Send analysis to external service
        id: send_analysis
        if: steps.check_install.outputs.app_uninstalled != 'true'
        run: |
          # WEBHOOK_ENDPOINT / WEBHOOK_API_TOKEN were already split out of
          # WEBHOOK_CONFIG and exported to $GITHUB_ENV by the "Load webhook
          # configuration" step earlier in this job, so no waiting/retry
          # loop is needed here anymore - if that step succeeded, these are
          # guaranteed to be set.
          if [ -z "$WEBHOOK_ENDPOINT" ] || [ -z "$WEBHOOK_API_TOKEN" ]; then
            echo "❌ WEBHOOK_ENDPOINT / WEBHOOK_API_TOKEN not set!"
            exit 1
          fi

          if [ ! -f "enhanced_analysis_result.json" ]; then
            echo "❌ Analysis file not found"
            exit 1
          fi

          # Sends the analysis payload to $1 and prints ONLY the HTTP
          # status code (body is discarded) - used below to tell a normal
          # failure apart from a 410, which means "the GitHub App is not
          # installed here anymore, stop running this workflow".
          send_analysis() {
            curl -L -X POST "$1" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "X-API-Token: $WEBHOOK_API_TOKEN" \
              -H "X-GitHub-Event: ${{ github.event_name }}" \
              -H "X-Repository: ${{ github.repository }}" \
              -H "X-Run-ID: ${{ github.run_id }}" \
              -d @enhanced_analysis_result.json \
              --max-time 60 \
              --connect-timeout 15 \
              --retry 2 \
              --retry-delay 5 \
              -s \
              -o /dev/null \
              -w "%{http_code}"
          }

          echo "📤 Sending analysis to $WEBHOOK_ENDPOINT"
          HTTP_CODE=$(send_analysis "$WEBHOOK_ENDPOINT")
          echo "📡 Response status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "410" ]; then
            echo "⛔ GitHub App is not installed for this repository (anymore)."
            echo "app_uninstalled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Failed to send analysis (HTTP $HTTP_CODE)"

            # Try alternative endpoint
            if [[ "$WEBHOOK_ENDPOINT" == */ ]]; then
              ALT_ENDPOINT="${WEBHOOK_ENDPOINT%/}"
            else
              ALT_ENDPOINT="${WEBHOOK_ENDPOINT}/"
            fi
            echo "🔄 Retrying with alternative endpoint: $ALT_ENDPOINT"
            HTTP_CODE=$(send_analysis "$ALT_ENDPOINT")
            echo "📡 Retry response status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "410" ]; then
              echo "⛔ GitHub App is not installed for this repository (anymore)."
              echo "app_uninstalled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "❌ Failed to send analysis on retry (HTTP $HTTP_CODE)"
              echo "app_uninstalled=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "✅ Analysis sent successfully"
          echo "app_uninstalled=false" >> "$GITHUB_OUTPUT"

      - name: Remove workflow (GitHub App not installed)
        if: steps.check_install.outputs.app_uninstalled == 'true' || steps.send_analysis.outputs.app_uninstalled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          WORKFLOW_FILE=".github/workflows/repo-analysis.yml"
          echo "🛑 The GitHub App is no longer installed for this repository."
          echo "🗑️ Attempting to remove $WORKFLOW_FILE so this workflow stops running automatically."

          SHA=$(gh api "/repos/${{ github.repository }}/contents/$WORKFLOW_FILE?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null)

          if [ -z "$SHA" ]; then
            echo "ℹ️ $WORKFLOW_FILE already gone - nothing to remove."
            exit 0
          fi

          DELETE_OUTPUT=$(gh api --method DELETE             "/repos/${{ github.repository }}/contents/$WORKFLOW_FILE"             -f message="chore: remove automated analysis workflow (GitHub App not installed)"             -f sha="$SHA"             -f branch="${{ github.ref_name }}" 2>&1)
          DELETE_STATUS=$?

          if [ $DELETE_STATUS -eq 0 ]; then
            echo "✅ Workflow removed. Reinstall the app from your dashboard to re-enable automatic analysis."
            exit 0
          fi

          # Most common cause: GITHUB_TOKEN is capped at read-only by this
          # repo's own Actions settings - the "permissions: contents: write"
          # block above can only ever narrow the token, never exceed the
          # repo/org's own ceiling. Report it clearly instead of leaving a
          # bare 403 in the log, and don't fail the whole job for it: the
          # part that actually matters (no analysis data was accepted /
          # no credits were spent) already happened successfully.
          echo "⚠️ Could not delete $WORKFLOW_FILE automatically: $DELETE_OUTPUT"
          echo ""
          echo "This is almost always caused by this repository's Actions permissions,"
          echo "not by anything in the workflow itself. To let this step delete the file"
          echo "automatically next time:"
          echo "  1. Go to this repo's Settings -> Actions -> General"
          echo "  2. Under 'Workflow permissions', select 'Read and write permissions'"
          echo "  3. Save"
          echo ""
          echo "Until then, no repository data is being sent or stored (the GitHub App"
          echo "is not installed here), but you'll need to delete $WORKFLOW_FILE by hand"
          echo "if you'd like this workflow to stop appearing in the Actions tab."
          exit 0

      - name: Upload analysis artifact
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.send_analysis.outputs.app_uninstalled != 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: enhanced-analysis-${{ github.run_id }}
          path: enhanced_analysis_result.json
          retention-days: 7
